server {
    listen 80;
    server_name xrtwinscape.di.unisa.it;

    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name xrtwinscape.di.unisa.it;

    ssl_certificate /etc/letsencrypt/live/xrtwinscape.di.unisa.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xrtwinscape.di.unisa.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50G;

    location /static/ {
        alias /workspace/staticfiles/;
        autoindex on;
        access_log on;
        expires 1y;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8001;
        proxy_read_timeout 1200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header "Access-Control-Allow-Origin" "http://localhost:3000";
        add_header "Access-Control-Allow-Credentials" "true";
        add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS";
        add_header "Access-Control-Allow-Headers" "Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range";

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range';
            add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE,PATCH';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
