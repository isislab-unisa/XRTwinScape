version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_twin_scape:/var/lib/mysql

  web:
    build: .
    container_name: twin_scape
    # command: ["gunicorn", "--bind", "0.0.0.0:8000", "twin_scape.wsgi:application"]
    volumes:
      - .:/workspace
      - ./staticfiles:/workspace/staticfiles
    expose:
      - 8001
    depends_on:
      - db
      - redis
    env_file:
      - .env
    restart: always

  celery:
    build: .
    container_name: twin_scape_celery
    command: celery -A twin_scape worker --concurrency=1 --loglevel=info
    volumes:
      - .:/workspace
    depends_on:
      - web
      - redis
    env_file:
      - .env

  celery-beat:
    build: .
    container_name: twin_scape_celery_beat
    command: celery -A twin_scape beat --loglevel=info
    volumes:
      - .:/workspace
    depends_on:
      - web
      - redis
    env_file:
      - .env

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.25-alpine
    container_name: hgraph-nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c '
      until /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo "Waiting for MinIO to be ready...";
        sleep 3;
      done;
      /usr/bin/mc mb --quiet myminio/lessons-media || true;
      /usr/bin/mc policy set none myminio/lessons-media || true;
      '
    
  # full_gaussian_pipe:
  #   image: atermoros/nerfstudio-mast3r:latest
  #   container_name: full_gaussian_pipe
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #   env_file:
  #     - .env
  #   gpus: all
  #   user: root
  #   shm_size: "48g"	
  #   ports:
  #     - "8090:8090"
  #   volumes:
  #     - ./full_gaussian_pipe:/workspace

  editor:
    container_name: xrtwinscape-editor
    build: ../editor
    ports:
      - "3000:3000"
    env_file:
      - .env
  
  certbot-renew:
    image: certbot/certbot
    container_name: certbot_renew
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot renew --webroot --webroot-path=/var/www/certbot && nginx -s reload"

volumes:
  mysql_data_twin_scape:
  minio_data:
